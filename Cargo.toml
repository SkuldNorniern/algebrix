[package]
name = "algebrix"
version = "0.1.0"
edition = "2024"
description = "Vectors, matrices, quaternions, and geometry for game engines; column vectors, optional SIMD."
documentation = "https://docs.rs/algebrix"
repository = "https://github.com/SkuldNorniern/algebrix"
license = "Apache-2.0"
authors = ["SkuldNorniern <eira@nornity.com>"]
keywords = ["math", "vector", "matrix", "quaternion", "geometry"]

[lib]
name = "algebrix"
path = "src/lib.rs"

[dependencies]
glam = {version="0.31.0", optional = true}
nalgebra = {version="0.34.1", optional = true}

[features]
default = ["std", "simd"]
std = []
simd = []  # Auto-detect SIMD
simd-x86 = []  # Force x86_64 SIMD
simd-arm = []  # Force ARM SIMD
scalar-math = []  # Disable SIMD, use scalar only
glam-compatibility = ["dep:glam"]
nalgebra-compatibility = ["dep:nalgebra"]

[dev-dependencies]
criterion = "0.5"
glam = "0.31"

[[bench]]
name = "math"
harness = false
